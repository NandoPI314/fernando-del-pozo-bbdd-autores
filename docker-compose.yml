services:
  db:
    image: postgres:16-alpine
    container_name: authors_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-authors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authors}
      POSTGRES_DB: ${POSTGRES_DB:-authors_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authors} -d ${POSTGRES_DB:-authors_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    container_name: authors_pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-authors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authors}
      POSTGRES_DB: ${POSTGRES_DB:-authors_db}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["python", "src/run_pipeline.py"]

volumes:
  db_data:
